    <!-- Measuring Tape -->
    <rect x="22" y="72" width="56" height="10" fill="#FFEB3B" />
    <g stroke="#FBC02D" stroke-width="1.2">
        <line x1="32" y1="72" x2="32" y2="77" />
        <line x1="42" y1="72" x2="42" y2="77" />
        <line x1="52" y1="72" x2="52" y2="77" />
        <line x1="62" y1="72" x2="62" y2="77" />
        <line x1="72" y1="72" x2="72" y2="77" />
