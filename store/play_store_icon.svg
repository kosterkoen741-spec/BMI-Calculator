    <circle cx="50" cy="50" r="42" fill="#42A5F5" />
    <!-- Modern Weighing Scale Icon -->
    <rect x="30" y="30" width="40" height="40" fill="#FFFFFF" />
    <rect x="34" y="34" width="32" height="32" fill="#E3F2FD" />
    <rect x="38" y="38" width="24" height="12" fill="#1565C0" />
